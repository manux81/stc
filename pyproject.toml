# Summary: Defines package metadata and Python test configuration.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stc"
version = "0.2.0"
description = "IEC 61131-3 Structured Text compiler front-end"
authors = [{ name = "Manuele Conti", email = "conti.manuele@gmail.com" }]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"

[project.scripts]
stc = "stc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["stc*"]

[tool.setuptools.package-data]
stc = ["runtime/*.c", "runtime/*.rs", "stdlib/*.st", "stdlib/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
